# SLURM profiles for src/run.py. Each key becomes an sbatch --<key>=<value> option.

# Run in every job before singularity
setup: module purge && module load singularity

configurations:
  - type: general-partition-debug
    account: your_account
    qos: your_cpu_debug_qos
    output: slurm_output/job_%j.out
    error: slurm_output/job_%j.err
    nodes: 1
    time: "02:00:00"
    ntasks: 1
    cpus-per-task: 80
  - type: general-partition
    account: your_account
    qos: your_cpu_qos
    output: slurm_output/job_%j.out
    error: slurm_output/job_%j.err
    nodes: 1
    time: "4:00:00"
    ntasks: 1
    cpus-per-task: 80
  - type: accelerate-partition-debug
    account: your_account
    qos: your_gpu_debug_qos
    output: slurm_output/job_%j.out
    error: slurm_output/job_%j.err
    nodes: 1
    time: "02:00:00"
    gres: gpu:4
    ntasks: 1
    cpus-per-task: 80
    exclusive: true
  - type: accelerate-partition
    account: your_account
    qos: your_gpu_qos
    output: slurm_output/job_%j.out
    error: slurm_output/job_%j.err
    nodes: 1
    time: "02:00:00"
    ntasks: 1
    cpus-per-task: 80
