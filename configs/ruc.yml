benchmark:
  - task: RuC
    hdl: sv # sv (SystemVerilog) or v (Verilog)
    dataset_path: /path/to/datasets/RuC-Opentitan-NonAgentic-final/  # Folder with one subfolder per project
    model_path: /path/to/models/  # Folder containing the models
    output_path: /path/to/results/RuC-Opentitan-NonAgentic-final/  # Folder to store the generation results
    singularity_image: /path/to/containers/vllm-openai-0.10.1-k2.sif  # Singularity image for inference
    evaluation_image: /path/to/containers/ruc-eval-slang.sif  # Singularity image for evaluation and benchmark creation
    agentic:
      harness: harbor.cli.main        # Module the harness is invoked as
      harbor_python: third_party/harbor/.venv/bin/python   # Built by third_party/harbor/setup_harbor.sh
      harbor_src: third_party/harbor/harbor-src/src
      agent: opencode                 # Agent the harness drives
      executor: singularity           # Harbor backend: no Docker daemon on the cluster
      provider: vllm-local            # Prefix Harbor uses to pick its provider config
      concurrency: 16                 # Concurrent agent runs
      max_parallel: 64                # Concurrent equivalence checks (self-eval and --fnc benchmark build)
      base_container: /path/to/containers/ruc-sim-opencode.sif   # Built from slurm/inference/agentic/ruc-sim-opencode.def
      docker_image: ruc-eval-slang:latest
      holes_per_task: 1
      min_files_per_task: 2
      min_rules_per_task: 2
      hole_visibility: marked
      agent_timeout_s: 36000
      verifier_timeout_s: 600
      harbor_overhead_s: 36000
      timeout_is_pass: False          # A yosys timeout is not evidence of equivalence
    models:
      - name: Qwen2.5-Coder-14B
        slurm_config_inference: accelerate-partition-debug
        slurm_config_evaluate: general-partition # SLURM configuration for evaluation and benchmark creation
        precision: bfloat16
        temperature: 0.2
        sequence_length_limit: 32768
        max_tokens: 2048
        top_p: 0.95
        top_k: -1
        n_samples: 1
        gpu_memory_utilization: 0.85
        swap_space: 16
        tensor_parallel_size: 4
        batch_size: 64
        debug: true
      - name: gemma-4-31B-it
        slurm_config_inference: accelerate-partition
        slurm_config_evaluate: general-partition
        precision: bfloat16
        debug: true
      - name: Qwen3.6-27B
        slurm_config_inference: accelerate-partition
        slurm_config_evaluate: general-partition
        precision: bfloat16
        debug: true
      - name: Qwen3.8-27B
        slurm_config_inference: accelerate-partition-debug
        slurm_config_evaluate: general-partition
        precision: bfloat16
        debug: true
      - name: DeepSeek-V3.1-Terminus
        slurm_config_inference: accelerate-partition
        slurm_config_evaluate: general-partition
        precision: bfloat16
        debug: true
      - name: DeepSeek-V4-Pro-0813
        slurm_config_inference: accelerate-partition-debug
        slurm_config_evaluate: general-partition-debug
        precision: bfloat16
        debug: true
      - name: Kimi-K2.7-Code
        slurm_config_inference: accelerate-partition-debug
        slurm_config_evaluate: general-partition-debug
        precision: bfloat16
        debug: true
      - name: GLM-5.2-FP8
        slurm_config_inference: accelerate-partition-debug
        slurm_config_evaluate: general-partition
        precision: auto
        debug: true
      - name: InCoder-32B-Thinking
        slurm_config_inference: accelerate-partition-debug
        slurm_config_evaluate: general-partition
        precision: bfloat16
        debug: true
      - name: NVIDIA-Nemotron-3-Super-120B-A12B-BF16
        slurm_config_inference: accelerate-partition-debug
        slurm_config_evaluate: general-partition
        precision: bfloat16
        debug: true
      - name: MiniMax-M3
        slurm_config_inference: accelerate-partition-debug
        slurm_config_evaluate: general-partition
        precision: bfloat16
        debug: true
